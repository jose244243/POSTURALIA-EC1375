<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu pago — Certificación EC1375 · POSTURALIA</title>
<meta name="theme-color" content="#0d2a6e">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="posturalia-styles.css">
<link rel="stylesheet" href="plataforma-styles.css">
<style>
  body { min-height:100vh; background:var(--bg); margin:0; padding:8vh 16px 40px }
  .pg { max-width:560px; margin:0 auto }
  .pg-marca { font-weight:800; letter-spacing:.06em; color:#0d2a6e; text-align:center; margin-bottom:16px }
  :root[data-tema="oscuro"] .pg-marca { color:#dbe4ff }
  .pg .card { background:var(--white); border-radius:16px; padding:24px 20px; box-shadow:0 12px 32px rgba(13,42,110,.08) }
  .pg h1 { font-size:1.25rem; margin:0 0 8px }
  .pg p, .pg li { color:var(--mid); font-size:.92rem; line-height:1.6 }
  .pg-estado { display:inline-block; font-weight:700; font-size:.8rem; padding:4px 10px; border-radius:999px; margin-bottom:10px }
  .pg-ok { background:#ECFDF5; color:#047857 } .pg-esp { background:#FFFBEB; color:#92400E } .pg-no { background:#FEF2F2; color:#B91C1C }
  :root[data-tema="oscuro"] .pg-ok { background:#0E2A21; color:#86EFAC }
  :root[data-tema="oscuro"] .pg-esp { background:#2A210E; color:#FCD34D }
  :root[data-tema="oscuro"] .pg-no { background:#2A0E0E; color:#FCA5A5 }
  .pg-dato { font-size:.85rem; background:var(--bg); border-radius:10px; padding:10px 12px; margin:12px 0 }
  .pg-acc { display:flex; flex-direction:column; gap:10px; margin-top:18px }
  .pg-acc .btn-plat { justify-content:center }
  .pg-aviso { font-size:.8rem; color:var(--muted); margin-top:16px }
</style>
</head>
<body>
<main class="pg">
  <div class="pg-marca">POSTURALIA</div>
  <div class="card" id="app"><p>Cargando…</p></div>
</main>
<script type="module">
/* ============================================================================
   pago.html — Adonde regresa Mercado Pago después de pagar
   (success.html / pending.html / failure.html de Paideia, en una sola página)

   Mercado Pago regresa aquí con el resultado en la dirección:
     ?status=approved|pending|in_process|rejected|null&payment_id=…
   (también collection_status / collection_id). Sirve para las tres
   «back_urls» de una preferencia; también se puede usar a mano con
   ?resultado=exito|pendiente|fallo.

   Diferencias deliberadas con Paideia:
     · La de Paideia dice siempre «$2,000 ✓ Pagado», aunque la abra alguien
       que no pagó nada: es una página fija. Aquí solo se dice lo que
       Mercado Pago mandó, y se aclara que la fase la abre el Centro al
       confirmar el pago (la plataforma no cobra ni confirma sola).
     · No se promete «comunidad de 156+ terapeutas» ni fechas: no hay dato.
     · El número de operación va en el mensaje de WhatsApp para que el
       equipo lo encuentre en Mercado Pago sin pedirle captura.
   ========================================================================== */
import { aplicarTema } from './js/tema.js';
import { CONFIG } from './js/config.js';
import { sesion } from './js/cuenta.js';
import { esc } from './js/seguro.js';

aplicarTema();
const q = new URLSearchParams(location.search);
const crudo = (q.get('status') || q.get('collection_status') || '').toLowerCase();
const manual = (q.get('resultado') || '').toLowerCase();
const operacion = String(q.get('payment_id') || q.get('collection_id') || '').replace(/[^0-9]/g, '').slice(0, 20);
const tipo = String(q.get('payment_type') || '').replace(/[^a-z_]/gi, '').slice(0, 30);

function resultadoDe(status, resultado) {
  if (status === 'approved' || resultado === 'exito') return 'aprobado';
  if (['pending', 'in_process', 'authorized'].includes(status) || resultado === 'pendiente') return 'pendiente';
  if (['rejected', 'cancelled', 'null'].includes(status) || resultado === 'fallo') return 'fallido';
  return 'sin-dato';
}
const r = resultadoDe(crudo, manual);
const s = sesion();
const wa = CONFIG.marca.whatsapp;
const aviso = CONFIG.avisoReembolso ? `<p class="pg-aviso">${esc(CONFIG.avisoReembolso)}</p>` : '';
const ligaWa = texto => wa ? `<a class="btn-plat btn-plat--secundario" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(texto)}">Avisar al equipo por WhatsApp</a>` : '';
const quien = s?.correo ? ` Mi correo en la plataforma: ${s.correo}.` : '';
const numOp = operacion ? ` Número de operación de Mercado Pago: ${operacion}.` : '';
const dato = operacion ? `<div class="pg-dato">Número de operación: <strong>${operacion}</strong>${tipo ? ` · ${esc(tipo.replace(/_/g, ' '))}` : ''}<br>Guárdalo: con él el equipo encuentra tu pago.</div>` : '';
const seguir = s
  ? `<a class="btn-plat" href="index.html">Ir a mi panel</a>`
  : `<a class="btn-plat" href="registro.html">Registrarme en la plataforma</a><a class="btn-plat btn-plat--secundario" href="index.html">Ya tengo cuenta: entrar</a>`;

const V = {
  aprobado: `
    <span class="pg-estado pg-ok">Pago aprobado por Mercado Pago</span>
    <h1>¡Listo, recibimos tu pago!</h1>
    <p>Mercado Pago nos avisa que tu pago se aprobó. El equipo de ${esc(CONFIG.marca.nombre)} lo confirma y te abre la fase que pagaste en tu panel; te avisamos por WhatsApp.</p>
    ${dato}
    <div class="pg-acc">${seguir}${ligaWa(`Hola, acabo de pagar en Mercado Pago mi fase de la certificación ${CONFIG.marca.estandar}.${numOp}${quien}`)}</div>`,
  pendiente: `
    <span class="pg-estado pg-esp">Pago en proceso</span>
    <h1>Tu pago está en proceso</h1>
    <p>Mercado Pago todavía no lo confirma. Pasa con pagos en efectivo (OXXO u otra tienda), transferencias y algunas tarjetas: puede tardar desde unos minutos hasta un par de días hábiles.</p>
    <ul><li><strong>No vuelvas a pagar</strong> mientras tanto: se cobraría dos veces.</li>
        <li>Si pagaste en tienda, conserva tu ticket.</li>
        <li>Cuando Mercado Pago lo apruebe, el equipo te abre la fase y te avisa.</li></ul>
    ${dato}
    <div class="pg-acc">${seguir}${ligaWa(`Hola, mi pago de la certificación ${CONFIG.marca.estandar} quedó en proceso en Mercado Pago.${numOp}${quien} ¿Me ayudan a revisarlo?`)}</div>`,
  fallido: `
    <span class="pg-estado pg-no">Pago no completado</span>
    <h1>Tu pago no se completó</h1>
    <p>Mercado Pago no aprobó el pago o se canceló antes de terminar. Cuando Mercado Pago rechaza un pago, no se hace el cargo.</p>
    <p>Suele pasar por fondos insuficientes, una tarjeta que el banco rechazó o la conexión que se cortó. Puedes intentarlo de nuevo con otra tarjeta o pagar por transferencia: los dos caminos están en la caja de pago de tu panel.</p>
    ${dato}
    <div class="pg-acc">${s ? `<a class="btn-plat" href="index.html">Intentar de nuevo desde mi panel</a>` : seguir}${ligaWa(`Hola, intenté pagar mi fase de la certificación ${CONFIG.marca.estandar} y no se completó.${numOp}${quien}`)}</div>`,
  'sin-dato': `
    <h1>Tu pago</h1>
    <p>Esta página es a donde regresa Mercado Pago después de pagar, pero no trae el resultado de ningún pago.</p>
    <p>Si acabas de pagar, revisa el correo o la app de Mercado Pago: ahí ves si quedó aprobado. En tu panel ves qué fases ya tienes abiertas.</p>
    <div class="pg-acc">${seguir}${ligaWa(`Hola, tengo una duda sobre mi pago de la certificación ${CONFIG.marca.estandar}.${quien}`)}</div>`,
};
document.getElementById('app').innerHTML = V[r] + aviso;
document.getElementById('app').dataset.resultado = r;
</script>
</body>
</html>
