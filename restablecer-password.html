<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restablecer contraseña — POSTURALIA</title>
<meta name="theme-color" content="#0d2a6e">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="posturalia-styles.css">
<link rel="stylesheet" href="plataforma-styles.css">
<style>
  body { min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:10vh 16px; background:var(--bg) }
  .caja { width:100%; max-width:440px; background:var(--white); border-radius:18px; padding:28px 24px; box-shadow:0 20px 50px rgba(13,42,110,.12) }
  .caja h1 { font-size:1.2rem; margin:0 0 6px } .caja p { color:var(--mid); font-size:.9rem; line-height:1.6 }
  .caja label { display:block; font-weight:600; font-size:.84rem; margin:12px 0 5px }
  .caja input { width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px; font:inherit }
  .caja button, .caja a.btn { display:block; width:100%; margin-top:14px; padding:11px; border-radius:10px; border:0; background:#0d2a6e; color:#fff; font:inherit; font-weight:700; cursor:pointer; text-align:center; text-decoration:none }
  .err { color:#B91C1C; font-size:.86rem } .ok { color:#047857; font-size:.9rem }
</style>
</head>
<body>
<main class="caja">
  <div style="font-weight:800;letter-spacing:.06em;color:#0d2a6e;margin-bottom:14px">POSTURALIA</div>
  <h1>Pon tu contraseña</h1>
  <div id="cuerpo"><p>Verificando el enlace…</p></div>
</main>
<script type="module">
/* Adonde llega el correo de "¿Olvidaste tu contraseña?" (como
   restablecer-password.html de Paideia). Supabase abre la sesión de
   recuperación con el enlace; aquí solo se pide la contraseña nueva. Sirve
   también para quien entraba con enlace mágico y nunca puso contraseña. */
import { CONFIG } from './js/config.js';
const $ = id => document.getElementById(id);
const nube = !!(CONFIG.supabase?.url && CONFIG.supabase?.anonKey);

if (!nube) {
  $('cuerpo').innerHTML = `<p>La plataforma está en <strong>modo local</strong>: no se mandan correos de recuperación.
    Entra a tu proceso y en "¿Olvidaste tu contraseña?" confirma tu CURP para poner una nueva. Si eres del equipo,
    pide a una persona administradora que te la restablezca en <em>Acceso del equipo</em>.</p>
    <a class="btn" href="index.html">Ir a mi proceso</a>`;
} else {
  const { clienteNube, Auth } = await import('./js/nube.js');
  const c = await clienteNube();
  await new Promise(r => setTimeout(r, 400));       // deja que el SDK procese el enlace
  const { data } = await c.auth.getSession();
  if (!data?.session) {
    $('cuerpo').innerHTML = `<p class="err">El enlace ya no es válido o ya se usó. Vuelve a pedir "¿Olvidaste tu contraseña?".</p>
      <a class="btn" href="index.html">Volver</a>`;
  } else {
    $('cuerpo').innerHTML = `<p>Para <strong>${data.session.user.email.replace(/[<>&"]/g, '')}</strong></p>
      <label for="p1">Contraseña nueva (mínimo 6 caracteres)</label><input type="password" id="p1" autocomplete="new-password">
      <label for="p2">Confírmala</label><input type="password" id="p2" autocomplete="new-password">
      <p class="err" id="msg"></p><button id="guardar">Guardar contraseña</button>`;
    $('guardar').onclick = async () => {
      const p1 = $('p1').value, p2 = $('p2').value;
      if (p1.length < 6) { $('msg').textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
      if (p1 !== p2) { $('msg').textContent = 'Las contraseñas no coinciden.'; return; }
      const r = await Auth.cambiarContrasena(p1);
      $('cuerpo').innerHTML = r.ok
        ? `<p class="ok">Listo: tu contraseña quedó guardada.</p><a class="btn" href="index.html">Entrar a mi proceso</a>`
        : `<p class="err">No se pudo guardar: ${String(r.motivo).replace(/[<>&"]/g, '')}</p>`;
    };
  }
}
</script>
</body>
</html>
